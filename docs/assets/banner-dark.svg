<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="DataTeller: a question goes to an LLM that fills a JSON query; a validator, a compiler that adds the tenant filter, and a read-only Postgres transaction take it from there. The LLM never writes SQL.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#656c76"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="329" rx="16" fill="#151b23" stroke="#3d444d"/>
<text x="60" y="92" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#f0f6fc">DataTeller</text>
<text x="60" y="134" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#9198a1">Plain-language questions on multi-tenant data, for Rails. <tspan fill="#f0f6fc" font-weight="600">The LLM never writes SQL.</tspan></text>
<rect x="60" y="196" width="220" height="68" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1" stroke-dasharray="6 4"/>
<text x="170.0" y="225" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" font-weight="400" fill="#f0f6fc">“How many paid orders</text>
<text x="170.0" y="247" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="14" fill="#f0f6fc">ship tomorrow?”</text>
<line x1="284" y1="230.0" x2="311" y2="230.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="315" y="196" width="180" height="68" rx="10" fill="#0d1117" stroke="#ff7b72" stroke-width="2"/>
<text x="405.0" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">LLM</text>
<text x="405.0" y="247" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">fills a JSON query</text>
<line x1="499" y1="230.0" x2="526" y2="230.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="530" y="196" width="150" height="68" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
<text x="605.0" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">Validator</text>
<text x="605.0" y="247" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">names, roles, types</text>
<line x1="684" y1="230.0" x2="711" y2="230.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="715" y="196" width="220" height="68" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
<text x="825.0" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">Compiler</text>
<text x="825.0" y="247" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">tenant filter on every table</text>
<line x1="939" y1="230.0" x2="966" y2="230.0" stroke="#656c76" stroke-width="2" marker-end="url(#a)"/>
<rect x="970" y="196" width="170" height="68" rx="10" fill="#0d1117" stroke="#3fb950" stroke-width="2"/>
<text x="1055.0" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f0f6fc">Postgres</text>
<text x="1055.0" y="247" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">read-only, time-bounded</text>
<line x1="315" y1="282" x2="495" y2="282" stroke="#ff7b72" stroke-width="2"/>
<text x="405" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#ff7b72">untrusted output</text>
<line x1="530" y1="282" x2="1140" y2="282" stroke="#3fb950" stroke-width="2"/>
<text x="835" y="302" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#3fb950">our code, with bound parameters only</text>
</svg>
