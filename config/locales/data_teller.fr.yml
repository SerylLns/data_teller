fr:
  data_teller:
    palette:
      trigger: Poser une question
      placeholder: Posez une question sur vos données…
      submit: Demander
      close: Fermer
      error: Une erreur est survenue. Merci de réessayer.
    outcome:
      no_rows: Rien ne correspond à cette question.
      clarify: "Laquelle de ces options vouliez-vous dire ?"
      truncated:
        one: Seule la première ligne est affichée.
        other: Seules les %{count} premières lignes sont affichées.
    refusal:
      unknown_dataset: Je ne peux pas répondre à cette question avec les données auxquelles vous avez accès.
      unknown_metric: Je ne peux pas répondre à cette question avec les données auxquelles vous avez accès.
      unsupported_query: Je ne peux pas répondre à cette question sous cette forme.
      not_a_data_question: Je ne réponds qu'aux questions sur vos données.
      too_many_groups: Cela donnerait trop de résultats. Essayez de préciser votre question.
      group_too_small: Cela concernerait trop peu de personnes pour être affiché. Essayez une question plus large.
      query_timeout: Cette question a pris trop de temps. Essayez de la préciser.
      invalid_question: Merci de saisir une question de 500 caractères au maximum.
      llm_unavailable: L'assistant n'est pas disponible pour le moment. Merci de réessayer plus tard.
      no_tenant: Ce n'est pas disponible pour votre compte.
      engine_disabled: Ce n'est pas disponible pour le moment.
