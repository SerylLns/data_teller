en:
  data_teller:
    palette:
      trigger: Ask a question
      placeholder: Ask about your data…
      submit: Ask
      close: Close
      error: Something went wrong. Please try again.
    outcome:
      no_rows: Nothing matches this question.
      clarify: "Which one did you mean?"
      truncated:
        one: Only the first row is shown.
        other: Only the first %{count} rows are shown.
    # A forbidden name and an unknown one read the same (ADR 0001 D5).
    refusal:
      unknown_dataset: This isn't something I can answer with the data available to you.
      unknown_metric: This isn't something I can answer with the data available to you.
      unsupported_query: I can't answer this question in that form.
      not_a_data_question: I can only answer questions about your data.
      too_many_groups: This would return too many results. Try narrowing it down.
      query_timeout: This question took too long to answer. Try narrowing it down.
      invalid_question: Please type a question of 500 characters at most.
      llm_unavailable: The assistant is not available right now. Please try again later.
      no_tenant: This isn't available for your account.
      engine_disabled: This isn't available right now.
